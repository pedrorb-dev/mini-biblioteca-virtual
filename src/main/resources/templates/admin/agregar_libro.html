<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>El Rincón del Libro - Agregar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        form .invalid-feedback {
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">El Rincón del Libro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/libros">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin">Administración</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1>Agregar Nuevo Libro</h1>

        <form th:action="@{/admin/libros/nuevo}" th:object="${libro}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" th:field="*{titulo}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Sinopsis</label>
                <textarea th:field="*{sinopsis}" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Autores</label>
                <select th:field="*{autores}" class="form-control" multiple>
                    <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nombre}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Editorial</label>
                <input type="text" th:field="*{editorial}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Publicación</label>
                <input type="date" th:field="*{fecha}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">URL del Libro</label>
                <input type="text" th:field="*{urlLibro}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Portada</label>
                <input type="file" th:field="*{portada}" class="form-control" accept="image/*" required>
            </div>

            <button type="submit" class="btn btn-primary">Guardar Libro</button>
            <a href="/admin" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/gh/fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>

</html>
