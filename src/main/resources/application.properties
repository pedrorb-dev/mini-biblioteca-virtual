spring.application.name=springboot-biblioteca

spring.datasource.url=jdbc:mysql://localhost:3306/db_biblioteca
spring.datasource.username=root
spring.datasource.password=#xPedro18
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=100MB
storage.location=assets
spring.thymeleaf.enabled=true
spring.web.resources.add-mappings=false
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:./assets/